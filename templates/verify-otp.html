{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Verify Your Account</h2>

    <p class="card-subtitle">
        Enter the verification code sent to your mobile number.
    </p>


    {% if message %}

        <div class="alert">
            {{ message }}
        </div>

    {% endif %}


    <form
        method="POST"
        action="/register/verify-otp"
    >

        <label>
            Phone OTP
        </label>


        <input
            type="text"
            name="phone_otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
        >


        <button
            type="submit"
        >
            Verify OTP
        </button>

    </form>


    <div class="otp-info">

        <p>
            OTP sent to:
        </p>

        <strong>
            +91 {{ phone }}
        </strong>

    </div>

</div>

{% endblock %}
