<aside class="betslip">

    <h3>🎯 Bet Slip</h3>

    <div id="bets-container">
        <p id="empty-betslip">No selections yet.</p>
    </div>

    <div class="stake-box">

        <label for="stake">Stake</label>

        <div class="rupee-input">

            <span>₹</span>



            <input
                id="stake"
                type="number"
                min="1"
                step="1"
                placeholder="Enter stake"
            >

        </div>    

        <div id="potential-win">
            Potential win: ₹0.00
        </div>

        <button
            type="button"
            id="place-bet-btn"
        >
            Place Bet
        </button>

    </div>

</aside>
