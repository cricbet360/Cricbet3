<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ match.event_name if match else "CrickBet Match" }}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #071b12;
            color: #ffffff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 14px;
            border-radius: 8px;
            background: #123d28;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #185234;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            color: #38d996;
        }

        .match-header {
            background: #0b2418;
            border: 1px solid #174a30;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .event-name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
        }

        .team {
            flex: 1;
            min-width: 0;
        }

        .vs {
            color: #61b995;
            font-size: 13px;
            flex-shrink: 0;
        }

        .match-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 999px;
            background: #123d28;
            color: #b9d8ca;
            font-size: 12px;
        }

        .live-badge {
            background: #6e201d !important;
            color: #ffb5b0 !important;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
            border-radius: 9px;
            background: #0a2116;
            border: 1px solid #123d28;
            font-size: 13px;
            color: #9dc4b2;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f3b33e;
            flex-shrink: 0;
        }

        .status-dot.online {
            background: #32d583;
        }

        .status-dot.error {
            background: #e65c5c;
        }

        .refresh-text {
            color: #719c89;
            font-size: 12px;
        }

        /* =================================================
           MARKET
        ================================================= */

        .market {
            margin-bottom: 14px;
            border: 1px solid #174a30;
            border-radius: 12px;
            overflow: hidden;
            background: #091f14;
        }

        .market-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            background: #0d2b1d;
            border-bottom: 1px solid #174a30;
        }

        .market-title {
            font-size: 15px;
            font-weight: 800;
        }

        .market-status {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 999px;
            background: #143c28;
            color: #8ed9b4;
        }

        .market-body {
            width: 100%;
        }

        .market-columns {
            display: grid;
            grid-template-columns:
                minmax(150px, 1fr)
                100px
                100px;
            gap: 6px;
            padding: 8px 10px;
            color: #719c89;
            font-size: 11px;
            text-transform: uppercase;
        }

        .market-columns > div:not(:first-child) {
            text-align: center;
        }

        .runner {
            display: grid;
            grid-template-columns:
                minmax(150px, 1fr)
                100px
                100px;
            gap: 6px;
            align-items: center;
            padding: 9px 10px;
            border-top: 1px solid #123622;
        }

        .runner-name {
            font-size: 14px;
            font-weight: 700;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .odd-box {
            min-height: 48px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            transition:
                transform 0.08s ease,
                filter 0.08s ease;
        }

        .odd-box:hover {
            filter: brightness(1.15);
        }

        .odd-box:active {
            transform: scale(0.97);
        }

        .back-box {
            background: #153f64;
            border: 1px solid #225e91;
        }

        .lay-box {
            background: #612f3b;
            border: 1px solid #873f50;
        }

        .fancy-yes {
            background: #164c35;
            border: 1px solid #237d54;
        }

        .fancy-no {
            background: #612f3b;
            border: 1px solid #873f50;
        }

        .odd-price {
            font-size: 15px;
            font-weight: 800;
        }

        .odd-size {
            margin-top: 3px;
            font-size: 10px;
            color: #b6d1c4;
        }

        .empty {
            padding: 22px 14px;
            text-align: center;
            color: #6f9886;
            font-size: 13px;
        }

        .loading {
            padding: 28px 14px;
            text-align: center;
            color: #8bb5a2;
        }

        .spinner {
            width: 22px;
            height: 22px;
            margin: 0 auto 9px;
            border: 2px solid #214b37;
            border-top-color: #36d48d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =================================================
           BET SLIP
        ================================================= */

        .bet-slip {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 380px;
            max-width: calc(100vw - 30px);
            background: #0b2418;
            border: 1px solid #28734b;
            border-radius: 14px;
            box-shadow:
                0 18px 55px
                rgba(0, 0, 0, 0.55);
            z-index: 9999;
            overflow: hidden;
            display: none;
        }

        .bet-slip.open {
            display: block;
        }

        .bet-slip-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            background: #0e3020;
            border-bottom: 1px solid #1b5437;
        }

        .bet-slip-heading {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bet-slip-title {
            font-size: 16px;
            font-weight: 800;
        }

        .bet-slip-count {
            min-width: 21px;
            height: 21px;
            padding: 0 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: #1fa66a;
            font-size: 11px;
            font-weight: 800;
        }

        .minimize-slip {
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 7px;
            background: #153d2a;
            color: #ffffff;
            font-size: 19px;
            line-height: 1;
            cursor: pointer;
        }

        .minimize-slip:hover {
            background: #1d583b;
        }

        .bet-slip-body {
            padding: 12px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .slip-empty {
            padding: 20px 10px;
            text-align: center;
            color: #769b89;
            font-size: 13px;
        }

        .slip-event {
            margin-bottom: 10px;
            border: 1px solid #1a5135;
            border-radius: 10px;
            overflow: hidden;
        }

        .slip-event:last-child {
            margin-bottom: 0;
        }

        .slip-event-title {
            padding: 9px 10px;
            background: #0e3020;
            color: #bfe3d1;
            font-size: 12px;
            font-weight: 800;
        }

        .slip-selection {
            padding: 10px;
            border-top: 1px solid #17462f;
        }

        .slip-selection:first-child {
            border-top: 0;
        }

        .slip-selection-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .slip-selection-name {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.3;
        }

        .remove-selection {
            border: 0;
            background: transparent;
            color: #a06d6d;
            cursor: pointer;
            font-size: 17px;
            line-height: 1;
            padding: 0 2px;
        }

        .remove-selection:hover {
            color: #ff8585;
        }

        .slip-market {
            margin-top: 4px;
            color: #759b88;
            font-size: 11px;
        }

        .slip-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 8px;
        }

        .slip-type {
            padding: 4px 7px;
            border-radius: 5px;
            background: #153d2a;
            color: #8fceb0;
            font-size: 10px;
            font-weight: 800;
        }

        .slip-side {
            padding: 4px 7px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 800;
        }

        .slip-side.back {
            background: #153f64;
            color: #9ed2ff;
        }

        .slip-side.lay {
            background: #612f3b;
            color: #ffc0c9;
        }

        .slip-odds {
            margin-left: auto;
            font-size: 15px;
            font-weight: 900;
        }

        .slip-stake-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 9px;
        }

        .slip-stake-label {
            color: #789f8c;
            font-size: 11px;
        }

        .stake-input {
            flex: 1;
            min-width: 0;
            padding: 9px 10px;
            border-radius: 7px;
            border: 1px solid #275e43;
            background: #071b12;
            color: #ffffff;
            outline: none;
        }

        .stake-input:focus {
            border-color: #38d996;
        }

        .bet-slip-footer {
            padding: 12px;
            border-top: 1px solid #1a5135;
            background: #091f14;
        }

        .slip-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .summary-box {
            padding: 9px;
            border-radius: 7px;
            background: #0d2b1d;
        }

        .summary-label {
            color: #719c89;
            font-size: 10px;
        }

        .summary-value {
            margin-top: 3px;
            font-size: 14px;
            font-weight: 800;
        }

        .place-all-btn {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #1fa66a;
            color: #ffffff;
            font-weight: 800;
            cursor: pointer;
        }

        .place-all-btn:hover {
            background: #25bd78;
        }

        .place-all-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .bet-message {
            display: none;
            margin-top: 9px;
            padding: 9px 10px;
            border-radius: 7px;
            font-size: 12px;
            line-height: 1.4;
        }

        .bet-message.show {
            display: block;
        }

        .bet-message.error {
            background: #4a1f22;
            border: 1px solid #813b42;
            color: #ffb9bd;
        }

        .bet-message.success {
            background: #123f2b;
            border: 1px solid #287d55;
            color: #9cf0c3;
        }

        /* =================================================
           REOPEN BUTTON
        ================================================= */

        .bet-slip-reopen {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 9998;
            display: none;
            align-items: center;
            gap: 7px;
            padding: 11px 15px;
            border: 1px solid #28734b;
            border-radius: 9px;
            background: #0d3020;
            color: #ffffff;
            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.4);
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
        }

        .bet-slip-reopen.show {
            display: inline-flex;
        }

        .reopen-count {
            min-width: 19px;
            height: 19px;
            padding: 0 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: #1fa66a;
        }

        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 650px) {

            .page {
                padding: 10px;
            }

            .teams {
                font-size: 15px;
                gap: 10px;
            }

            .market-columns,
            .runner {
                grid-template-columns:
                    minmax(110px, 1fr)
                    82px
                    82px;
            }

            .odd-box {
                min-height: 44px;
            }

            .odd-price {
                font-size: 13px;
            }

            .odd-size {
                font-size: 9px;
            }

            .bet-slip {
                right: 8px;
                bottom: 8px;
                width: calc(100vw - 16px);
                max-width: none;
            }

            .bet-slip-reopen {
                right: 10px;
                bottom: 10px;
            }
        }

    </style>

</head>


<body>


<div class="page">


    <div class="topbar">

        <a
            href="/dashboard"
            class="back-btn"
        >
            ← Back
        </a>

        <div class="brand">
            CrickBet
        </div>

    </div>


    <!-- =====================================================
         MATCH HEADER
    ====================================================== -->

    <section class="match-header">

        <div
            class="event-name"
            id="eventName"
        >
            {{ match.event_name if match else "Cricket Match" }}
        </div>


        <div class="teams">

            <div
                class="team"
                id="team1"
            >
                {{ match.team1 if match else "" }}
            </div>

            <div class="vs">
                VS
            </div>

            <div
                class="team"
                id="team2"
            >
                {{ match.team2 if match else "" }}
            </div>

        </div>


        <div class="match-info">

            <span
                class="badge"
                id="matchStatus"
            >
                Loading
            </span>

            <span
                class="badge"
                id="matchTime"
            >
                --
            </span>

        </div>

    </section>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div class="status-bar">

        <div class="status-left">

            <span
                class="status-dot"
                id="statusDot"
            ></span>

            <span id="statusText">
                Loading odds...
            </span>

        </div>

        <span
            class="refresh-text"
            id="refreshText"
        >
            --
        </span>

    </div>


    <!-- =====================================================
         MARKETS
    ====================================================== -->

    <main id="marketsContainer">

        <div class="loading">

            <div class="spinner"></div>

            Loading markets...

        </div>

    </main>


</div>


<!-- =========================================================
     MATCH DATA
========================================================= -->

<div
    id="matchData"
    data-game-id="{{ match.game_id if match else '' }}"
    data-event-id="{{ match.event_id if match else '' }}"
    data-market-id="{{ match.market_id if match else '' }}"
    data-event-name="{{ match.event_name if match else '' }}"
    data-team1="{{ match.team1 if match else '' }}"
    data-team2="{{ match.team2 if match else '' }}"
    data-event-time="{{ match.event_time if match else '' }}"
    data-in-play="{{ 'true' if match and match.in_play else 'false' }}"
    hidden
></div>


<!-- =========================================================
     BET SLIP
========================================================= -->

<div
    class="bet-slip"
    id="betSlip"
>

    <div class="bet-slip-header">

        <div class="bet-slip-heading">

            <div class="bet-slip-title">
                Bet Slip
            </div>

            <span
                class="bet-slip-count"
                id="betSlipCount"
            >
                0
            </span>

        </div>


        <button
            type="button"
            class="minimize-slip"
            id="minimizeSlipButton"
            aria-label="Minimize bet slip"
            title="Minimize"
        >
            −
        </button>

    </div>


    <div
        class="bet-slip-body"
        id="betSlipBody"
    >

        <div class="slip-empty">
            Select odds from a market to add a bet.
        </div>

    </div>


    <div class="bet-slip-footer">

        <div class="slip-summary">

            <div class="summary-box">

                <div class="summary-label">
                    Total Stake
                </div>

                <div
                    class="summary-value"
                    id="totalStake"
                >
                    ₹0.00
                </div>

            </div>


            <div class="summary-box">

                <div class="summary-label">
                    Potential Return
                </div>

                <div
                    class="summary-value"
                    id="potentialReturn"
                >
                    ₹0.00
                </div>

            </div>

        </div>


        <button
            type="button"
            class="place-all-btn"
            id="placeAllButton"
            disabled
        >
            Place Bet
        </button>


        <div
            class="bet-message"
            id="betMessage"
        ></div>

    </div>

</div>


<!-- =========================================================
     REOPEN BET SLIP BUTTON
========================================================= -->

<button
    type="button"
    class="bet-slip-reopen"
    id="reopenSlipButton"
>

    BET SLIP

    <span
        class="reopen-count"
        id="reopenSlipCount"
    >
        0
    </span>

</button>


<script>

"use strict";


/* =========================================================
   GLOBAL STATE
========================================================= */

let gameId = "";
let eventId = "";
let marketId = "";

let oddsLoading = false;
let refreshTimer = null;

let betSlipItems = [];

const BET_SLIP_STORAGE =
    "crickbet_bet_slip";


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHtml(value);
}


function numberValue(value) {

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;
}


/* =========================================================
   READ MATCH
========================================================= */

function readServerMatch() {

    const element =
        document.getElementById(
            "matchData"
        );

    if (!element) {
        return null;
    }

    const data =
        element.dataset;

    if (!data.gameId) {
        return null;
    }

    return {

        game_id:
            data.gameId,

        event_id:
            data.eventId ||
            data.gameId,

        market_id:
            data.marketId ||
            "",

        event_name:
            data.eventName ||
            "",

        team1:
            data.team1 ||
            "",

        team2:
            data.team2 ||
            "",

        event_time:
            data.eventTime ||
            "",

        in_play:
            data.inPlay === "true"
    };
}


/* =========================================================
   INITIALIZE
========================================================= */

function initializeMatch() {

    const match =
        readServerMatch();

    if (!match) {
        return;
    }

    gameId =
        String(
            match.game_id
        );

    eventId =
        String(
            match.event_id ||
            match.game_id
        );

    marketId =
        String(
            match.market_id ||
            ""
        );

    updateMatchHeader(
        match
    );
}


/* =========================================================
   MATCH HEADER
========================================================= */

function updateMatchHeader(
    match
) {

    if (!match) {
        return;
    }

    const eventName =
        document.getElementById(
            "eventName"
        );

    const team1 =
        document.getElementById(
            "team1"
        );

    const team2 =
        document.getElementById(
            "team2"
        );

    const status =
        document.getElementById(
            "matchStatus"
        );

    const time =
        document.getElementById(
            "matchTime"
        );


    if (eventName) {

        eventName.textContent =
            match.event_name ||
            "Cricket Match";
    }


    if (team1) {

        team1.textContent =
            match.team1 ||
            "";
    }


    if (team2) {

        team2.textContent =
            match.team2 ||
            "";
    }


    if (status) {

        const live =
            match.in_play === true ||
            match.in_play === 1 ||
            match.in_play === "true";

        status.textContent =
            live
                ? "LIVE"
                : "UPCOMING";

        status.classList.toggle(
            "live-badge",
            live
        );
    }


    if (time) {

        time.textContent =
            formatTime(
                match.event_time
            );
    }
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(value) {

    if (!value) {
        return "--";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return String(value);
    }

    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    state,
    text
) {

    const dot =
        document.getElementById(
            "statusDot"
        );

    const status =
        document.getElementById(
            "statusText"
        );

    if (dot) {

        dot.className =
            "status-dot";

        if (state === "online") {
            dot.classList.add(
                "online"
            );
        }

        if (state === "error") {
            dot.classList.add(
                "error"
            );
        }
    }

    if (status) {
        status.textContent =
            text;
    }
}


/* =========================================================
   LOAD ODDS
========================================================= */

async function loadOdds() {

    if (
        oddsLoading ||
        !gameId ||
        !marketId
    ) {
        return;
    }

    oddsLoading = true;

    try {

        const query =
            new URLSearchParams();

        query.set(
            "gameId",
            gameId
        );

        query.set(
            "eventId",
            eventId ||
            gameId
        );

        query.set(
            "marketId",
            marketId
        );


        const response =
            await fetch(
                "/api/cricket/odds?" +
                query.toString(),
                {
                    method: "GET",
                    credentials:
                        "same-origin",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                data.detail ||
                "Odds unavailable"
            );
        }


        renderMarkets(data);


        setStatus(
            "online",
            "Odds live"
        );


        const refreshText =
            document.getElementById(
                "refreshText"
            );

        if (refreshText) {

            refreshText.textContent =
                "Updated just now";
        }


    } catch (error) {

        console.error(
            "[MATCH] odds error:",
            error
        );

        setStatus(
            "error",
            "Odds unavailable"
        );

    } finally {

        oddsLoading = false;
    }
}


/* =========================================================
   GET ODDS ROOT
========================================================= */

function getOddsRoot(
    payload
) {

    if (
        payload &&
        payload.odds
    ) {
        return payload.odds;
    }

    if (
        payload &&
        payload.data &&
        !Array.isArray(
            payload.data
        )
    ) {
        return payload.data;
    }

    return payload || {};
}


/* =========================================================
   RENDER MARKETS
========================================================= */

function renderMarkets(
    payload
) {

    const container =
        document.getElementById(
            "marketsContainer"
        );

    if (!container) {
        return;
    }


    const root =
        getOddsRoot(
            payload
        );


    const matchOdds =
        Array.isArray(
            root.match_odds
        )
            ? root.match_odds
            : [];


    const bookmakerOdds =
        Array.isArray(
            root.bookmaker_odds
        )
            ? root.bookmaker_odds
            : [];


    const fancyOdds =
        Array.isArray(
            root.fancy_odds
        )
            ? root.fancy_odds
            : [];


    const otherOdds =
        Array.isArray(
            root.other_market_odds
        )
            ? root.other_market_odds
            : [];


    let html = "";


    /* -----------------------------------------------------
       MATCH ODDS
    ----------------------------------------------------- */

    if (
        matchOdds.length
    ) {

        matchOdds.forEach(
            market => {

                html +=
                    buildMatchMarket(
                        market
                    );
            }
        );

    } else {

        html +=
            buildEmptyMarket(
                "Match Odds",
                "Match odds currently unavailable."
            );
    }


    /* -----------------------------------------------------
       BOOKMAKER
    ----------------------------------------------------- */

    if (
        bookmakerOdds.length
    ) {

        bookmakerOdds.forEach(
            market => {

                html +=
                    buildBookmakerMarket(
                        market
                    );
            }
        );

    } else {

        html +=
            buildEmptyMarket(
                "🏏 Bookmaker",
                "ProExch did not provide bookmaker runners for this match."
            );
    }


    /* -----------------------------------------------------
       FANCY / SESSION
    ----------------------------------------------------- */

    if (
        fancyOdds.length
    ) {

        html +=
            '<section class="market">';

        html +=
            '<div class="market-header">';

        html +=
            '<div class="market-title">' +
            '🎯 Fancy / Session' +
            "</div>";

        html +=
            '<div class="market-status">' +
            fancyOdds.length +
            " market" +
            (
                fancyOdds.length === 1
                    ? ""
                    : "s"
            ) +
            "</div>";

        html +=
            "</div>";

        html +=
            '<div class="market-body">';


        fancyOdds.forEach(
            market => {

                html +=
                    buildFancyMarket(
                        market
                    );
            }
        );


        html +=
            "</div>";

        html +=
            "</section>";

    } else {

        html +=
            buildEmptyMarket(
                "🎯 Fancy / Session",
                "No fancy/session markets are currently available."
            );
    }


    /* -----------------------------------------------------
       OTHER MARKETS
    ----------------------------------------------------- */

    otherOdds.forEach(
        market => {

            html +=
                buildGenericMarket(
                    market
                );
        }
    );


    container.innerHTML =
        html;


    attachBetEvents();
}

/* =========================================================

========================================================= */

function buildFancyMarket(
    market
) {

    const rows =
        Array.isArray(
            market.rows
        )
            ? market.rows
            : (
                Array.isArray(
                    market.runners
                )
                    ? market.runners
                    : []
            );


    const rawName =
        market.name ||
        market.market_name ||
        market.mname ||
        "Fancy";


    const rawType =
        String(
            market.market_type ||
            market.type ||
            market.gtype ||
            ""
        ).toUpperCase();


    const isSession =
        rawType.includes(
            "SESSION"
        ) ||
        rawType.includes(
            "SESSION_ODDS"
        );


    const marketType =
        isSession
            ? "SESSION"
            : "FANCY";


    const marketTitle =
        marketType === "SESSION"
            ? "Session"
            : "Fancy";


    let html =
        '<div class="fancy-market-block">';


    html +=
        '<div class="market-header">';

    html +=
        '<div class="market-title">' +
        escapeHtml(
            rawName
        ) +
        "</div>";

    html +=
        '<div class="market-status">' +
        escapeHtml(
            market.status ||
            "OPEN"
        ) +
        "</div>";

    html +=
        "</div>";


    html +=
        '<div class="market-body">';


    html +=
        '<div class="market-columns">' +
        "<div>" +
        escapeHtml(
            marketTitle

        "</div>";


    if (!rows.length) {

        html +=
            '<div class="empty">' +
            "No rows available in this market." +
            "</div>";

    } else {

        rows.forEach(
            row => {

                const name =
                    row.name ||
                    row.rname ||
                    row.session ||
                    row.runner_name ||
                    "Session";


                const selectionId =
                    row.sid ||
                    row.selection_id ||
                    row.selectionId ||
                    row.id ||

                const yes =

                    row.back;


                const yesSize =
                    row.yes_size ??
                    row.back_size;

                        rawName,
                        name,
                        selectionId,
                        "LAY"

/* =========================================================
   ODD BOX
========================================================= */

function createOddBox(
    price,
    size,
    cssClass,
    marketType,
    marketName,
    selection,
    selectionId,
    side
) {

    const numericPrice =
        Number(price);


    const valid =
        Number.isFinite(
            numericPrice
        ) &&
        numericPrice > 1;


    if (!valid) {

        return (

            '<div class="odd-box ' +
            cssClass +
            '">' +

                '<div class="odd-price">' +
                    "-" +
                "</div>" +

            "</div>"
        );
    }


    const numericSize =
        Number(size);


    const sizeText =
        Number.isFinite(
            numericSize
        ) &&
        numericSize > 0
            ? numericSize.toFixed(2)
            : "";


    let html =
        '<div class="odd-box ' +
        cssClass + '"' +

        ' data-bet-market-type="' +
        escapeAttribute(
            marketType
        ) +
        '"' +

        ' data-bet-market-name="' +
        escapeAttribute(
            marketName
        ) +
        '"' +

        ' data-bet-selection="' +
        escapeAttribute(
            selection
        ) +
        '"' +

        ' data-bet-selection-id="' +
        escapeAttribute(
            selectionId
        ) +
        '"' +

        ' data-bet-side="' +
        escapeAttribute(
            side
        ) +
        '"' +

        ' data-bet-odds="' +
        escapeAttribute(
            numericPrice
        ) +
        '">';


    html +=
        '<div class="odd-price">';

    /*
     * Fancy / Session display
     */

    if (
        marketType === "FANCY" ||
        marketType === "SESSION"
    ) {

        html +=
            side === "BACK"
                ? "YES "
                : "NO ";
    }


    html +=
        numericPrice.toFixed(2);

    html +=
        "</div>";


    if (sizeText) {

        html +=
            '<div class="odd-size">' +
            sizeText +
            "</div>";
    }


    html +=
        "</div>";


    return html;
}


/* =========================================================
   BET EVENTS
========================================================= */

function attachBetEvents() {

    document
        .querySelectorAll(
            "[data-bet-market-type]"
        )
        .forEach(
            box => {

                box.addEventListener(
                    "click",
                    function() {

                        const odds =
                            Number(
                                box.dataset.betOdds
                            );


                        const selectionId =
                            box.dataset
                                .betSelectionId;


                        if (
                            !Number.isFinite(
                                odds
                            ) ||
                            odds <= 1
                        ) {
                            return;
                        }


                        if (!selectionId) {

                            showBetMessage(
                                "Selection ID is unavailable. Refresh the odds and try again.",
                                "error"
                            );

                            return;
                        }


                        addToBetSlip({

                            gameId:
                                String(
                                    gameId
                                ),

                            eventId:
                                String(
                                    eventId ||
                                    gameId
                                ),

                            marketId:
                                String(
                                    marketId
                                ),

                            marketType:
                                String(
                                    box.dataset
                                        .betMarketType
                                ).toUpperCase(),

                            marketName:
                                String(
                                    box.dataset
                                        .betMarketName ||
                                    ""
                                ),

                            selectionId:
                                String(
                                    selectionId
                                ),

                            selectionName:
                                String(
                                    box.dataset
                                        .betSelection ||
                                    ""
                                ),

                            side:
                                String(
                                    box.dataset
                                        .betSide
                                ).toUpperCase(),

                            odds:
                                odds,

                            stake:
                                0,

                            eventName:
                                document
                                    .getElementById(
                                        "eventName"
                                    )
                                    ?.textContent
                                    ?.trim() ||
                                "Cricket Match"
                        });
                    }
                );
            }
        );
}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function loadBetSlip() {

    try {

        const raw =
            localStorage.getItem(
                BET_SLIP_STORAGE
            );

        if (!raw) {
            betSlipItems = [];
            return;
        }

        const parsed =
            JSON.parse(raw);

        betSlipItems =
            Array.isArray(parsed)
                ? parsed
                : [];

    } catch (error) {

        console.error(
            "[BETSLIP] storage error:",
            error
        );

        betSlipItems = [];
    }
}


function saveBetSlip() {

    try {

        localStorage.setItem(
            BET_SLIP_STORAGE,
            JSON.stringify(
                betSlipItems
            )
        );

    } catch (error) {

        console.error(
            "[BETSLIP] save error:",
            error
        );
    }
}


/* =========================================================
   ADD BET TO SLIP
========================================================= */

function addToBetSlip(
    item
) {

    const key =
        [
            item.gameId,
            item.marketId,
            item.marketType,
            item.selectionId,
            item.side
        ].join("|");


    /*
     * Same selection + same side:
     * update odds instead of duplicating.
     */

    const existingIndex =
        betSlipItems.findIndex(
            current => {

                const currentKey =
                    [
                        current.gameId,
                        current.marketId,
                        current.marketType,
                        current.selectionId,
                        current.side
                    ].join("|");

                return currentKey === key;
            }
        );


    if (
        existingIndex >= 0
    ) {

        betSlipItems[
            existingIndex
        ].odds =
            item.odds;

    } else {

        /*
         * Different side of same selection:
         * remove previous one.
         */

        betSlipItems =
            betSlipItems.filter(
                current => !(
                    String(
                        current.gameId
                    ) === String(
                        item.gameId
                    ) &&

                    String(
                        current.marketId
                    ) === String(
                        item.marketId
                    ) &&

                    String(
                        current.marketType
                    ) === String(
                        item.marketType
                    ) &&

                    String(
                        current.selectionId
                    ) === String(
                        item.selectionId
                    )
                )
            );


        betSlipItems.push(
            item
        );
    }


    saveBetSlip();

    renderBetSlip();

    openBetSlip();
}


/* =========================================================
   REMOVE BET
========================================================= */

function removeBetFromSlip(
    index
) {

    if (
        index < 0 ||
        index >= betSlipItems.length
    ) {
        return;
    }


    betSlipItems.splice(
        index,
        1
    );


    saveBetSlip();

    renderBetSlip();
}


/* =========================================================
   UPDATE STAKE
========================================================= */

function updateStake(
    index,
    value
) {

    if (
        index < 0 ||
        index >= betSlipItems.length
    ) {
        return;
    }


    const stake =
        Number(value);


    betSlipItems[index].stake =
        Number.isFinite(stake) &&
        stake > 0
            ? stake
            : 0;


    saveBetSlip();

    updateSlipSummary();
}


/* =========================================================
   RENDER BET SLIP
========================================================= */

function renderBetSlip() {

    const body =
        document.getElementById(
            "betSlipBody"
        );

    const count =
        document.getElementById(
            "betSlipCount"
        );

    const reopenCount =
        document.getElementById(
            "reopenSlipCount"
        );

    const placeButton =
        document.getElementById(
            "placeAllButton"
        );


    if (count) {

        count.textContent =
            String(
                betSlipItems.length
            );
    }


    if (reopenCount) {

        reopenCount.textContent =
            String(
                betSlipItems.length
            );
    }


    if (!body) {
        return;
    }


    if (!betSlipItems.length) {

        body.innerHTML =
            '<div class="slip-empty">' +
            "Select odds from a market to add a bet." +
            "</div>";

        if (placeButton) {
            placeButton.disabled = true;
        }

        updateSlipSummary();

        return;
    }


    /*
     * Group by event.
     */

    const groups = new Map();


    betSlipItems.forEach(
        (item, index) => {

            const eventKey =
                String(
                    item.gameId ||
                    item.eventId ||
                    "event"
                );


            if (!groups.has(
                eventKey
            )) {

                groups.set(
                    eventKey,
                    []
                );
            }


            groups.get(
                eventKey
            ).push({
                item,
                index
            });
        }
    );


    let html = "";


    groups.forEach(
        (items) => {

            const eventName =
                items[0].item.eventName ||
                "Cricket Match";


            html +=
                '<div class="slip-event">';


            html +=
                '<div class="slip-event-title">' +
                escapeHtml(
                    eventName
                ) +
                "</div>";


            items.forEach(
                entry => {

                    const item =
                        entry.item;

                    const index =
                        entry.index;


                    const isFancy =
                        item.marketType ===
                            "FANCY" ||
                        item.marketType ===
                            "SESSION";


                    const displaySide =
                        isFancy
                            ? (
                                item.side ===
                                    "BACK"
                                    ? "YES"
                                    : "NO"
                            )
                            : item.side;


                    const sideClass =
                        item.side ===
                            "BACK"
                            ? "back"
                            : "lay";


                    const marketLabel =
                        item.marketType ===
                            "SESSION"
                            ? "Session"
                            : item.marketType ===
                                "FANCY"
                                ? "Fancy"
                                : item.marketType ===
                                    "BOOKMAKER"
                                    ? "Bookmaker"
                                    : "Match Odds";


                    html +=
                        '<div class="slip-selection">';


                    html +=
                        '<div class="slip-selection-top">';


                    html +=
                        '<div class="slip-selection-name">' +
                        escapeHtml(
                            item.selectionName
                        ) +
                        "</div>";


                    html +=
                        '<button ' +
                        'type="button" ' +
                        'class="remove-selection" ' +
                        'data-remove-index="' +
                        index +
                        '">' +
                        "×" +
                        "</button>";


                    html +=
                        "</div>";


                    html +=
                        '<div class="slip-market">' +
                        escapeHtml(
                            marketLabel
                        ) +
                        " • " +
                        escapeHtml(
                            item.marketName
                        ) +
                        "</div>";


                    html +=
                        '<div class="slip-meta">';


                    html +=
                        '<span class="slip-type">' +
                        escapeHtml(
                            marketLabel
                        ) +
                        "</span>";


                    html +=
                        '<span class="slip-side ' +
                        sideClass +
                        '">' +
                        escapeHtml(
                            displaySide
                        ) +
                        "</span>";


                    html +=
                        '<span class="slip-odds">' +
                        numberValue(
                            item.odds
                        ).toFixed(2) +
                        "</span>";


                    html +=
                        "</div>";


                    html +=
                        '<div class="slip-stake-row">';


                    html +=
                        '<span class="slip-stake-label">' +
                        "Stake" +
                        "</span>";


                    html +=
                        '<input ' +
                        'type="number" ' +
                        'class="stake-input" ' +
                        'min="1" ' +
                        'step="0.01" ' +
                        'value="' +
                        (
                            item.stake > 0
                                ? item.stake
                                : ""
                        ) +
                        '" ' +
                        'placeholder="Enter stake" ' +
                        'data-stake-index="' +
                        index +
                        '">' ;


                    html +=
                        "</div>";


                    html +=
                        "</div>";
                }
            );


            html +=
                "</div>";
        }
    );


    body.innerHTML =
        html;


    body
        .querySelectorAll(
            "[data-remove-index]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        removeBetFromSlip(
                            Number(
                                button.dataset
                                    .removeIndex
                            )
                        );
                    }
                );
            }
        );


    body
        .querySelectorAll(
            "[data-stake-index]"
        )
        .forEach(
            input => {

                input.addEventListener(
                    "input",
                    () => {

                        updateStake(
                            Number(
                                input.dataset
                                    .stakeIndex
                            ),
                            input.value
                        );
                    }
                );
            }
        );


    if (placeButton) {

        placeButton.disabled =
            betSlipItems.length === 0;
    }


    updateSlipSummary();
}


/* =========================================================
   SUMMARY
========================================================= */

function updateSlipSummary() {

    const totalStakeElement =
        document.getElementById(
            "totalStake"
        );

    const returnElement =
        document.getElementById(
            "potentialReturn"
        );


    let totalStake = 0;
    let totalReturn = 0;


    betSlipItems.forEach(
        item => {

            const stake =
                numberValue(
                    item.stake
                );

            const odds =
                numberValue(
                    item.odds
                );


            totalStake +=
                stake;

            totalReturn +=
                stake * odds;
        }
    );


    if (totalStakeElement) {

        totalStakeElement.textContent =
            "₹" +
            totalStake.toFixed(2);
    }


    if (returnElement) {

        returnElement.textContent =
            "₹" +
            totalReturn.toFixed(2);
    }
}


/* =========================================================
   OPEN BET SLIP
========================================================= */

function openBetSlip() {

    const slip =
        document.getElementById(
            "betSlip"
        );

    const reopen =
        document.getElementById(
            "reopenSlipButton"
        );


    if (slip) {

        slip.classList.add(
            "open"
        );
    }


    if (reopen) {

        reopen.classList.remove(
            "show"
        );
    }
}


/* =========================================================
   MINIMIZE BET SLIP
========================================================= */

function minimizeBetSlip() {

    const slip =
        document.getElementById(
            "betSlip"
        );

    const reopen =
        document.getElementById(
            "reopenSlipButton"
        );


    if (slip) {

        slip.classList.remove(
            "open"
        );
    }


    if (reopen) {

        reopen.classList.toggle(
            "show",
            betSlipItems.length > 0
        );
    }
}


/* =========================================================
   MESSAGE
========================================================= */

function showBetMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "betMessage"
        );

    if (!element) {
        return;
    }


    element.textContent =
        message;


    element.className =
        "bet-message show " +
        (
            type === "success"
                ? "success"
                : "error"
        );
}


function hideBetMessage() {

    const element =
        document.getElementById(
            "betMessage"
        );

    if (!element) {
        return;
    }


    element.textContent =
        "";

    element.className =
        "bet-message";
}


/* =========================================================
   PLACE ALL BETS
========================================================= */

async function placeAllBets() {

    hideBetMessage();


    if (!betSlipItems.length) {

        showBetMessage(
            "Your bet slip is empty.",
            "error"
        );

        return;
    }


    const invalid =
        betSlipItems.find(
            item =>
                !Number.isFinite(
                    Number(item.stake)
                ) ||
                Number(item.stake) <= 0
        );


    if (invalid) {

        showBetMessage(
            "Enter a valid stake for every selection.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "placeAllButton"
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "Placing...";
    }


    let placedCount = 0;


    try {

        /*
         * Place sequentially so the balance returned by
         * the backend remains authoritative.
         */

        for (
            let index = 0;
            index < betSlipItems.length;
            index++
        ) {

            const item =
                betSlipItems[index];


            const requestBody = {

                game_id:
                    String(
                        item.gameId
                    ),

                event_id:
                    String(
                        item.eventId ||
                        item.gameId
                    ),

                market_id:
                    String(
                        item.marketId
                    ),

                market_type:
                    String(
                        item.marketType
                    ).toUpperCase(),

                market_name:
                    String(
                        item.marketName ||
                        ""
                    ),

                selection_id:
                    String(
                        item.selectionId
                    ),

                selection_name:
                    String(
                        item.selectionName
                    ),

                /*
                 * Backend converts:
                 * YES -> BACK
                 * NO  -> LAY
                 *
                 * We already store internal BACK/LAY.
                 */

                side:
                    String(
                        item.side
                    ).toUpperCase(),

                odds:
                    Number(
                        item.odds
                    ),

                stake:
                    Number(
                        item.stake
                    )
            };


            console.log(
                "[BET] placing:",
                requestBody
            );


            const response =
                await fetch(
                    "/bets/place",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        credentials:
                            "same-origin",

                        body:
                            JSON.stringify(
                                requestBody
                            )
                    }
                );


            let data = {};

            try {

                data =
                    await response.json();

            } catch (error) {

                console.error(
                    "[BET] JSON error:",
                    error
                );
            }


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.detail ||
                    "Bet placement failed."
                );
            }


            if (!data.success) {

                throw new Error(
                    data.message ||
                    "Bet placement failed."
                );
            }


            placedCount++;


            /*
             * Remove the successfully placed item.
             */

            betSlipItems =
                betSlipItems.filter(
                    (_, itemIndex) =>
                        itemIndex !==
                        index
                );


            index--;


            saveBetSlip();

            renderBetSlip();


            if (
                data.balance !==
                undefined
            ) {

                updateDisplayedBalance(
                    data.balance
                );
            }
        }


        showBetMessage(
            placedCount +
            (
                placedCount === 1
                    ? " bet placed successfully."
                    : " bets placed successfully."
            ),
            "success"
        );


        setTimeout(
            () => {

                if (
                    betSlipItems.length === 0
                ) {

                    const slip =
                        document.getElementById(
                            "betSlip"
                        );

                    if (slip) {

                        slip.classList.remove(
                            "open"
                        );
                    }


                    const reopen =
                        document.getElementById(
                            "reopenSlipButton"
                        );

                    if (reopen) {

                        reopen.classList.remove(
                            "show"
                        );
                    }
                }

            },
            1600
        );


    } catch (error) {

        console.error(
            "[BET] placement error:",
            error
        );


        showBetMessage(
            error.message ||
            "Unable to place bet.",
            "error"
        );

    } finally {

        if (button) {

            button.disabled =
                betSlipItems.length === 0;

            button.textContent =
                "Place Bet";
        }
    }
}


/* =========================================================
   UPDATE BALANCE
========================================================= */

function updateDisplayedBalance(
    balance
) {

    const value =
        Number(balance);

    if (!Number.isFinite(value)) {
        return;
    }


    const formatted =
        "₹" +
        value.toFixed(2);


    document
        .querySelectorAll(
            ".balance"
        )
        .forEach(
            element => {

                element.textContent =
                    formatted;
            }
        );
}


/* =========================================================
   START POLLING
========================================================= */

function startOddsPolling() {

    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );
    }


    loadOdds();


    refreshTimer =
        setInterval(
            () => {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    loadOdds();
                }

            },
            3000
        );
}


/* =========================================================
   STOP POLLING
========================================================= */

function stopOddsPolling() {

    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );

        refreshTimer = null;
    }
}


/* =========================================================
   DOM READY
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        initializeMatch();

        loadBetSlip();

        renderBetSlip();


        const minimize =
            document.getElementById(
                "minimizeSlipButton"
            );

        if (minimize) {

            minimize.addEventListener(
                "click",
                minimizeBetSlip
            );
        }


        const reopen =
            document.getElementById(
                "reopenSlipButton"
            );

        if (reopen) {

            reopen.addEventListener(
                "click",
                openBetSlip
            );
        }


        const place =
            document.getElementById(
                "placeAllButton"
            );

        if (place) {

            place.addEventListener(
                "click",
                placeAllBets
            );
        }


        /*
         * Don't automatically cover the dashboard.
         * Existing selections can still be reopened
         * through BET SLIP.
         */

        const slip =
            document.getElementById(
                "betSlip"
            );

        if (slip) {

            slip.classList.remove(
                "open"
            );
        }


        const reopenButton =
            document.getElementById(
                "reopenSlipButton"
            );

        if (reopenButton) {

            reopenButton.classList.toggle(
                "show",
                betSlipItems.length > 0
            );
        }


        startOddsPolling();
    }
);


/* =========================================================
   TAB VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            stopOddsPolling();

        } else {

            startOddsPolling();
        }
    }
);

</script>
