<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ match.event_name if match else "CrickBet Match" }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #071b12;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 14px;
            border-radius: 8px;
            background: #123d28;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #185234;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            color: #38d996;
        }

        .match-header {
            background: #0b2418;
            border: 1px solid #174a30;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .event-name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
        }

        .team {
            flex: 1;
            min-width: 0;
        }

        .vs {
            color: #61b995;
            font-size: 13px;
            flex-shrink: 0;
        }

        .match-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 999px;
            background: #123d28;
            color: #b9d8ca;
            font-size: 12px;
        }

        .live-badge {
            background: #6e201d !important;
            color: #ffb5b0 !important;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
            border-radius: 9px;
            background: #0a2116;
            border: 1px solid #123d28;
            font-size: 13px;
            color: #9dc4b2;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f3b33e;
            flex-shrink: 0;
        }

        .status-dot.online {
            background: #32d583;
        }

        .status-dot.error {
            background: #e65c5c;
        }

        .refresh-text {
            color: #719c89;
            font-size: 12px;
        }

        .market {
            margin-bottom: 14px;
            border: 1px solid #174a30;
            border-radius: 12px;
            overflow: hidden;
            background: #091f14;
        }

        .market-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            background: #0d2b1d;
            border-bottom: 1px solid #174a30;
        }

        .market-title {
            font-size: 15px;
            font-weight: 800;
        }

        .market-status {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 999px;
            background: #143c28;
            color: #8ed9b4;
        }

        .market-body {
            width: 100%;
        }

        .market-columns {
            display: grid;
            grid-template-columns:
                minmax(150px, 1fr)
                100px
                100px;
            gap: 6px;
            padding: 8px 10px;
            color: #719c89;
            font-size: 11px;
            text-transform: uppercase;
        }

        .market-columns > div:not(:first-child) {
            text-align: center;
        }

        .runner {
            display: grid;
            grid-template-columns:
                minmax(150px, 1fr)
                100px
                100px;
            gap: 6px;
            align-items: center;
            padding: 9px 10px;
            border-top: 1px solid #123622;
        }

        .runner-name {
            font-size: 14px;
            font-weight: 700;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .odd-box {
            min-height: 48px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            transition:
                transform 0.08s ease,
                filter 0.08s ease;
        }

        .odd-box:hover {
            filter: brightness(1.15);
        }

        .odd-box:active {
            transform: scale(0.97);
        }

        .back-box {
            background: #153f64;
            border: 1px solid #225e91;
        }

        .lay-box {
            background: #612f3b;
            border: 1px solid #873f50;
        }

        .fancy-yes {
            background: #164c35;
            border: 1px solid #237d54;
        }

        .fancy-no {
            background: #612f3b;
            border: 1px solid #873f50;
        }

        .odd-price {
            font-size: 15px;
            font-weight: 800;
        }

        .odd-size {
            margin-top: 3px;
            font-size: 10px;
            color: #b6d1c4;
        }

        .empty {
            padding: 22px 14px;
            text-align: center;
            color: #6f9886;
            font-size: 13px;
        }

        .loading {
            padding: 28px 14px;
            text-align: center;
            color: #8bb5a2;
        }

        .spinner {
            width: 22px;
            height: 22px;
            margin: 0 auto 9px;
            border: 2px solid #214b37;
            border-top-color: #36d48d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .bet-slip {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 330px;
            max-width: calc(100vw - 36px);
            padding: 14px;
            background: #0c2619;
            border: 1px solid #23633f;
            border-radius: 12px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);
            z-index: 100;
            display: none;
        }

        .bet-slip.show {
            display: block;
        }

        .slip-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .slip-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
            font-size: 13px;
        }

        .slip-label {
            color: #86aa9a;
        }

        .slip-value {
            font-weight: 700;
            text-align: right;
            word-break: break-word;
        }

        .stake-input {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border-radius: 7px;
            border: 1px solid #275e43;
            background: #071b12;
            color: #ffffff;
            outline: none;
        }

        .stake-input:focus {
            border-color: #38d996;
        }

        .place-btn {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border: 0;
            border-radius: 7px;
            background: #1fa66a;
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        .place-btn:hover {
            background: #25bd78;
        }

        .place-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .close-slip {
            float: right;
            border: 0;
            background: transparent;
            color: #86aa9a;
            cursor: pointer;
            font-size: 18px;
        }

        @media (max-width: 650px) {
            .page {
                padding: 10px;
            }

            .teams {
                font-size: 15px;
                gap: 10px;
            }

            .market-columns,
            .runner {
                grid-template-columns:
                    minmax(110px, 1fr)
                    82px
                    82px;
            }

            .odd-box {
                min-height: 44px;
            }

            .odd-price {
                font-size: 13px;
            }

            .odd-size {
                font-size: 9px;
            }

            .bet-slip {
                right: 10px;
                bottom: 10px;
                width: calc(100vw - 20px);
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">

        <a href="/dashboard" class="back-btn">
            ← Back
        </a>

        <div class="brand">
            CrickBet
        </div>

    </div>


    <!-- =====================================================
         MATCH HEADER
    ====================================================== -->

    <section class="match-header">

        <div class="event-name" id="eventName">
            {{ match.event_name if match else "Cricket Match" }}
        </div>

        <div class="teams">

            <div class="team" id="team1">
                {{ match.team1 if match else "" }}
            </div>

            <div class="vs">
                VS
            </div>

            <div class="team" id="team2">
                {{ match.team2 if match else "" }}
            </div>

        </div>

        <div class="match-info">

            <span class="badge" id="matchStatus">
                Loading
            </span>

            <span class="badge" id="matchTime">
                --
            </span>

        </div>

    </section>


    <!-- =====================================================
         STATUS BAR
    ====================================================== -->

    <div class="status-bar">

        <div class="status-left">

            <span
                class="status-dot"
                id="statusDot"
            ></span>

            <span id="statusText">
                Loading odds...
            </span>

        </div>

        <span
            class="refresh-text"
            id="refreshText"
        >
            --
        </span>

    </div>


    <!-- =====================================================
         MARKETS
    ====================================================== -->

    <main id="marketsContainer">

        <div class="loading">

            <div class="spinner"></div>

            Loading markets...

        </div>

    </main>

</div>


<!-- =========================================================
     MATCH DATA

     Jinja is used ONLY in HTML attributes.
     Nothing is injected directly into JavaScript.
========================================================= -->

<div
    id="matchData"
    data-game-id="{{ match.game_id if match else '' }}"
    data-event-id="{{ match.event_id if match else '' }}"
    data-market-id="{{ match.market_id if match else '' }}"
    data-event-name="{{ match.event_name if match else '' }}"
    data-team1="{{ match.team1 if match else '' }}"
    data-team2="{{ match.team2 if match else '' }}"
    data-event-time="{{ match.event_time if match else '' }}"
    data-in-play="{{ 'true' if match and match.in_play else 'false' }}"
    hidden
></div>


<!-- =========================================================
     BET SLIP
========================================================= -->

<div class="bet-slip" id="betSlip">

    <button
        type="button"
        class="close-slip"
        id="closeSlipButton"
    >
        ×
    </button>

    <div class="slip-title">
        Bet Slip
    </div>

    <div class="slip-row">

        <span class="slip-label">
            Market
        </span>

        <span
            class="slip-value"
            id="slipMarket"
        >
            --
        </span>

    </div>

    <div class="slip-row">

        <span class="slip-label">
            Selection
        </span>

        <span
            class="slip-value"
            id="slipSelection"
        >
            --
        </span>

    </div>

    <div class="slip-row">

        <span class="slip-label">
            Type
        </span>

        <span
            class="slip-value"
            id="slipType"
        >
            --
        </span>

    </div>

    <div class="slip-row">

        <span class="slip-label">
            Odds
        </span>

        <span
            class="slip-value"
            id="slipOdds"
        >
            --
        </span>

    </div>

    <input
        type="number"
        id="stake"
        class="stake-input"
        placeholder="Enter stake"
        min="1"
        step="1"
    >

    <button
        type="button"
        class="place-btn"
        id="placeBetButton"
    >
        Place Bet
    </button>

</div>


<script>
"use strict";

/* =========================================================
   STATE
========================================================= */

let gameId = "";
let eventId = "";
let marketId = "";

let oddsLoading = false;
let selectedBet = null;
let refreshTimer = null;


/* =========================================================
   READ SERVER MATCH DATA
========================================================= */

function readServerMatch() {

    const element =
        document.getElementById("matchData");

    if (!element) {
        return null;
    }

    const data = element.dataset;

    if (!data.gameId) {
        return null;
    }

    return {
        game_id: data.gameId,
        event_id: data.eventId || data.gameId,
        market_id: data.marketId || "",
        event_name: data.eventName || "",
        team1: data.team1 || "",
        team2: data.team2 || "",
        event_time: data.eventTime || "",
        in_play: data.inPlay === "true"
    };
}


/* =========================================================
   GET GAME ID FROM URL
========================================================= */

function getGameIdFromUrl() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const queryGameId =
        params.get("gameId") ||
        params.get("game_id");

    if (queryGameId) {
        return queryGameId;
    }

    const parts =
        window.location.pathname
            .split("/")
            .filter(Boolean);

    if (parts.length > 0) {

        const last =
            parts[parts.length - 1];

        if (
            last &&
            last !== "match" &&
            last !== "matches"
        ) {
            return last;
        }
    }

    return "";
}


/* =========================================================
   INITIALIZE MATCH
========================================================= */

function initializeMatch() {

    const serverMatch =
        readServerMatch();

    if (
        serverMatch &&
        serverMatch.game_id
    ) {

        gameId =
            String(
                serverMatch.game_id
            );

        eventId =
            String(
                serverMatch.event_id ||
                serverMatch.game_id
            );

        marketId =
            String(
                serverMatch.market_id ||
                ""
            );

        updateMatchHeader(
            serverMatch
        );

        return;
    }


    gameId =
        getGameIdFromUrl();

    if (!gameId) {

        setStatus(
            "error",
            "Match ID missing"
        );

        return;
    }

    resolveMatchIds();
}


/* =========================================================
   UPDATE MATCH HEADER
========================================================= */

function updateMatchHeader(match) {

    if (!match) {
        return;
    }

    const eventName =
        document.getElementById(
            "eventName"
        );

    const team1 =
        document.getElementById(
            "team1"
        );

    const team2 =
        document.getElementById(
            "team2"
        );

    const status =
        document.getElementById(
            "matchStatus"
        );

    const time =
        document.getElementById(
            "matchTime"
        );


    if (eventName) {

        eventName.textContent =
            match.event_name ||
            "Cricket Match";
    }


    if (team1) {

        team1.textContent =
            match.team1 ||
            "";
    }


    if (team2) {

        team2.textContent =
            match.team2 ||
            "";
    }


    if (status) {

        const isLive =
            match.in_play === true ||
            match.in_play === 1 ||
            match.in_play === "true";

        status.textContent =
            isLive
                ? "LIVE"
                : "UPCOMING";

        status.classList.toggle(
            "live-badge",
            isLive
        );
    }


    if (time) {

        time.textContent =
            formatTime(
                match.event_time
            );
    }
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(value) {

    if (!value) {
        return "--";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return String(value);
    }

    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    state,
    text
) {

    const dot =
        document.getElementById(
            "statusDot"
        );

    const status =
        document.getElementById(
            "statusText"
        );


    if (dot) {

        dot.className =
            "status-dot";

        if (state === "online") {

            dot.classList.add(
                "online"
            );
        }

        if (state === "error") {

            dot.classList.add(
                "error"
            );
        }
    }


    if (status) {

        status.textContent =
            text;
    }
}


/* =========================================================
   LOAD ODDS
========================================================= */

async function loadOdds(
    force = false
) {

    if (oddsLoading) {
        return;
    }


    if (!gameId) {

        setStatus(
            "error",
            "Game ID missing"
        );

        return;
    }


    if (!marketId) {

        await resolveMatchIds();

        if (!marketId) {

            setStatus(
                "error",
                "Market ID unavailable"
            );

            return;
        }
    }


    oddsLoading = true;


    try {

        const query =
            new URLSearchParams();


        query.set(
            "gameId",
            gameId
        );


        query.set(
            "eventId",
            eventId || gameId
        );


        query.set(
            "marketId",
            marketId
        );


        if (force) {

            query.set(
                "refresh",
                "true"
            );
        }


        const response =
            await fetch(
                "/api/cricket/odds?" +
                query.toString(),
                {
                    method: "GET",
                    credentials: "same-origin",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.detail ||
                data.message ||
                "Odds unavailable"
            );
        }


        renderMarkets(data);


        setStatus(
            "online",
            "Odds live"
        );


        const refreshText =
            document.getElementById(
                "refreshText"
            );


        if (refreshText) {

            refreshText.textContent =
                "Updated just now";
        }

    } catch (error) {

        console.error(
            "[MATCH] odds error:",
            error
        );


        setStatus(
            "error",
            "Odds unavailable"
        );

    } finally {

        oddsLoading = false;
    }
}


/* =========================================================
   RESOLVE MATCH IDS
========================================================= */

async function resolveMatchIds() {

    if (!gameId) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/cricket/matches",
                {
                    method: "GET",
                    credentials: "same-origin",
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const payload =
            await response.json();


        const matches =
            Array.isArray(
                payload.data
            )
                ? payload.data
                : [];


        const found =
            matches.find(
                function(item) {

                    return String(
                        item.game_id
                    ) === String(
                        gameId
                    );
                }
            );


        if (!found) {
            return;
        }


        eventId =
            String(
                found.event_id ||
                gameId
            );


        marketId =
            String(
                found.market_id ||
                ""
            );


        updateMatchHeader(
            found
        );

    } catch (error) {

        console.error(
            "[MATCH] resolve error:",
            error
        );
    }
}


/* =========================================================
   RENDER MARKETS
========================================================= */

function renderMarkets(data) {

    const container =
        document.getElementById(
            "marketsContainer"
        );


    if (!container) {
        return;
    }


    const fragments = [];


    const matchOdds =
        Array.isArray(
            data.match_odds
        )
            ? data.match_odds
            : [];


    const bookmakerOdds =
        Array.isArray(
            data.bookmaker_odds
        )
            ? data.bookmaker_odds
            : [];


    const fancyOdds =
        Array.isArray(
            data.fancy_odds
        )
            ? data.fancy_odds
            : [];


    /* =====================================================
       MATCH ODDS
    ===================================================== */

    if (matchOdds.length > 0) {

        matchOdds.forEach(
            function(market) {

                fragments.push(
                    buildMatchMarket(
                        market
                    )
                );
            }
        );

    } else {

        fragments.push(
            buildEmptyMarket(
                "Match Odds",
                "Match odds currently unavailable"
            )
        );
    }


    /* =====================================================
       BOOKMAKER
    ===================================================== */

    bookmakerOdds.forEach(
        function(market) {

            fragments.push(
                buildBookmakerMarket(
                    market
                )
            );
        }
    );


    /* =====================================================
       FANCY
    ===================================================== */

    if (fancyOdds.length > 0) {

        fancyOdds.forEach(
            function(market) {

                fragments.push(
                    buildFancyMarket(
                        market
                    )
                );
            }
        );

    } else {

        fragments.push(
            buildEmptyMarket(
                "🎯 Fancy / Session",
                "No fancy/session markets available for this match"
            )
        );
    }


    container.innerHTML =
        fragments.join("");


    attachBetEvents();
}


/* =========================================================
   MATCH ODDS
========================================================= */

function buildMatchMarket(
    market
) {

    const runners =
        Array.isArray(
            market.runners
        )
            ? market.runners
            : [];


    let html = "";


    html +=
        '<section class="market">';


    html +=
        '<div class="market-header">';


    html +=
        '<div class="market-title">' +
        escapeHtml(
            market.name ||
            "Match Odds"
        ) +
        "</div>";


    html +=
        '<div class="market-status">' +
        escapeHtml(
            market.status ||
            "OPEN"
        ) +
        "</div>";


    html +=
        "</div>";


    html +=
        '<div class="market-body">';


    html +=
        '<div class="market-columns">' +
        "<div>Runner</div>" +
        "<div>Back</div>" +
        "<div>Lay</div>" +
        "</div>";


    if (runners.length === 0) {

        html +=
            '<div class="empty">' +
            "No runners available" +
            "</div>";

    } else {

        runners.forEach(
            function(runner) {

                const runnerName =
                    runner.name ||
                    runner.rname ||
                    "Runner";


                html +=
                    '<div class="runner">';


                html +=
                    '<div class="runner-name">' +
                    escapeHtml(
                        runnerName
                    ) +
                    "</div>";


                html += createOddBox(
                    runner.back,
                    runner.back_size,
                    "back-box",
                    market.name ||
                        "Match Odds",
                    runnerName,
                    "BACK"
                );


                html += createOddBox(
                    runner.lay,
                    runner.lay_size,
                    "lay-box",
                    market.name ||
                        "Match Odds",
                    runnerName,
                    "LAY"
                );


                html +=
                    "</div>";
            }
        );
    }


    html +=
        "</div>";


    html +=
        "</section>";


    return html;
}

/* =========================================================
   NORMAL ODD BOX
========================================================= */

function createOddBox(
    price,
    size,
    cssClass,
    market,
    selection,
    type
) {

    const numericPrice =
        Number(price);


    const valid =
        price !== null &&
        price !== undefined &&
        price !== "" &&
        Number.isFinite(
            numericPrice
        ) &&
        numericPrice > 0;


    if (!valid) {

        return (
            '<div class="odd-box ' +
            cssClass +
            '">' +

            '<div class="odd-price">' +
            "-" +
            "</div>" +

            "</div>"
        );
    }


    const numericSize =
        Number(size);


    const displaySize =
        Number.isFinite(
            numericSize
        ) &&
        numericSize > 0
            ? numericSize.toFixed(2)
            : "";


    let html =
        '<div ' +
        'class="odd-box ' +
        cssClass +
        '" ' +

        'data-bet-market="' +
        escapeAttribute(market) +
        '" ' +

        'data-bet-selection="' +
        escapeAttribute(selection) +
        '" ' +

        'data-bet-type="' +
        escapeAttribute(type) +
        '" ' +

        'data-bet-odds="' +
        escapeAttribute(
            numericPrice
        ) +
        '">';


    html +=
        '<div class="odd-price">' +
        numericPrice.toFixed(2) +
        "</div>";


    if (displaySize) {

        html +=
            '<div class="odd-size">' +
            displaySize +
            "</div>";
    }


    html +=
        "</div>";


    return html;
}

/* =========================================================
   ATTACH BET EVENTS
========================================================= */

function attachBetEvents() {

    const boxes =
        document.querySelectorAll(
            "[data-bet-market]"
        );


    boxes.forEach(
        function(box) {

            box.addEventListener(
                "click",
                function() {

                    const odds =
                        Number(
                            box.dataset.betOdds
                        );


                    if (
                        !Number.isFinite(
                            odds
                        ) ||
                        odds <= 0
                    ) {
                        return;
                    }


                    selectBet(
                        box.dataset.betMarket,
                        box.dataset.betSelection,
                        box.dataset.betType,
                        odds
                    );
                }
            );
        }
    );
}


/* =========================================================
   SELECT BET
========================================================= */

function selectBet(
    market,
    selection,
    type,
    odds
) {

    selectedBet = {
        market: market,
        selection: selection,
        type: type,
        odds: odds
    };


    const slipMarket =
        document.getElementById(
            "slipMarket"
        );


    const slipSelection =
        document.getElementById(
            "slipSelection"
        );


    const slipType =
        document.getElementById(
            "slipType"
        );


    const slipOdds =
        document.getElementById(
            "slipOdds"
        );


    const betSlip =
        document.getElementById(
            "betSlip"
        );


    if (slipMarket) {

        slipMarket.textContent =
            market;
    }


    if (slipSelection) {

        slipSelection.textContent =
            selection;
    }


    if (slipType) {

        slipType.textContent =
            type;
    }


    if (slipOdds) {

        slipOdds.textContent =
            Number(
                odds
            ).toFixed(2);
    }


    if (betSlip) {

        betSlip.classList.add(
            "show"
        );
    }
}


/* =========================================================
   CLOSE BET SLIP
========================================================= */

function closeBetSlip() {

    const betSlip =
        document.getElementById(
            "betSlip"
        );


    if (betSlip) {

        betSlip.classList.remove(
            "show"
        );
    }


    selectedBet = null;
}


/* =========================================================
   PLACE BET
========================================================= */

async function placeBet() {

    if (!selectedBet) {

        alert(
            "Please select odds first."
        );

        return;
    }


    const stakeInput =
        document.getElementById(
            "stake"
        );


    const stake =
        Number(
            stakeInput
                ? stakeInput.value
                : 0
        );


    if (
        !Number.isFinite(stake) ||
        stake <= 0
    ) {

        alert(
            "Enter a valid stake."
        );


        if (stakeInput) {
            stakeInput.focus();
        }


        return;
    }


    const placeButton =
        document.getElementById(
            "placeBetButton"
        );


    if (placeButton) {

        placeButton.disabled =
            true;

        placeButton.textContent =
            "Placing...";
    }


    try {

        const response =
            await fetch(
                "/bets/place",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify(
                            {
                                game_id:
                                    gameId,

                                event_id:
                                    eventId,

                                market_id:
                                    marketId,

                                market:
                                    selectedBet.market,

                                selection:
                                    selectedBet.selection,

                                bet_type:
                                    selectedBet.type,

                                odds:
                                    selectedBet.odds,

                                stake:
                                    stake
                            }
                        )
                }
            );


        let data = {};


        try {

            data =
                await response.json();

        } catch {

            data = {};
        }


        if (!response.ok) {

            throw new Error(
                data.detail ||
                data.message ||
                "Bet placement failed"
            );
        }


        alert(
            data.message ||
            "Bet placed successfully."
        );


        closeBetSlip();


        if (stakeInput) {
            stakeInput.value = "";
        }


    } catch (error) {

        console.error(
            "[BET] error:",
            error
        );


        alert(
            error.message ||
            "Unable to place bet."
        );

    } finally {

        if (placeButton) {

            placeButton.disabled =
                false;

            placeButton.textContent =
                "Place Bet";
        }
    }
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   ATTRIBUTE ESCAPE
========================================================= */

function escapeAttribute(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );
}


/* =========================================================
   START POLLING
========================================================= */

function startOddsPolling() {

    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );
    }


    loadOdds(false);


    refreshTimer =
        setInterval(
            function() {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    loadOdds(false);
                }

            },
            3000
        );
}


/* =========================================================
   STOP POLLING
========================================================= */

function stopOddsPolling() {

    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );

        refreshTimer = null;
    }
}


/* =========================================================
   PAGE INITIALIZATION
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        initializeMatch();


        const closeButton =
            document.getElementById(
                "closeSlipButton"
            );


        if (closeButton) {

            closeButton.addEventListener(
                "click",
                closeBetSlip
            );
        }


        const placeButton =
            document.getElementById(
                "placeBetButton"
            );


        if (placeButton) {

            placeButton.addEventListener(
                "click",
                placeBet
            );
        }


        startOddsPolling();
    }
);


/* =========================================================
   TAB VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            stopOddsPolling();

        } else {

            startOddsPolling();
        }
    }
);
</script>
