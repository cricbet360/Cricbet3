<div class="password-wrapper">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required
    >

    <button
        type="button"
        class="password-toggle"
        onclick="togglePassword('password', this)"
        aria-label="Show password"
    >
        <span class="eye-open">👁</span>
        <span class="eye-closed">◉̸</span>
    </button>
</div>
