{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Admin Login</h2>

    {% if message %}
    <p style="color:red">{{ message }}</p>
    {% endif %}

    <form method="POST" action="/admin/login">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

{% endblock %}
