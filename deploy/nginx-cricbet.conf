# CricBet - nginx reverse proxy
#
#   Internet --> nginx (ports 80/443) --> unix socket --> uvicorn/FastAPI
#
# Visitors just type https://yourdomain.com - no port number. The app
# itself never listens on a TCP port.
#
# "__DOMAIN__" is replaced by deploy/setup.sh.
# certbot adds the HTTPS (443) block and the http->https redirect itself.

upstream cricbet_app {
    server unix:/run/cricbet/cricbet.sock fail_timeout=0;
}

# Requests that are not for our domain (raw IP address, other hostnames
# pointed here) are dropped instead of showing the site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # The app accepts payment screenshots up to 5 MB; nginx's default
    # limit is 1 MB, which would reject them before the app sees them.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://cricbet_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
